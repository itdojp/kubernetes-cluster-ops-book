name: Temporary Issue 40 live validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  static-pod-reload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install pinned kind
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo kind-linux-amd64 \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64
          printf '%s  %s\n' \
            eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa \
            kind-linux-amd64 | sha256sum --check -
          sudo install -o root -g root -m 0755 kind-linux-amd64 /usr/local/bin/kind

      - name: Create pinned single-control-plane cluster
        shell: bash
        run: |
          set -euo pipefail
          kind create cluster \
            --name issue-40 \
            --image kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f \
            --wait 5m

      - name: Verify manifest-triggered etcd recreation without kubelet restart
        shell: bash
        run: |
          set -euo pipefail
          node=issue-40-control-plane

          before_uid="$(kubectl -n kube-system get pod -l component=etcd -o jsonpath='{.items[0].metadata.uid}')"
          kubelet_pid="$(docker exec "$node" pidof kubelet | awk '{print $1}')"
          kubelet_start="$(docker exec "$node" cat "/proc/${kubelet_pid}/stat" | awk '{print $22}')"
          test -n "$before_uid"
          test -n "$kubelet_pid"
          test -n "$kubelet_start"

          token="issue-40-$(date +%s)"
          docker exec -e ISSUE_40_TOKEN="$token" "$node" sh -euxc '
            install -d -o root -g root -m 0700 /etc/kubernetes/etcd-restore-work
            cp -p /etc/kubernetes/manifests/etcd.yaml /etc/kubernetes/etcd-restore-work/etcd.yaml
            grep -q "^  annotations:$" /etc/kubernetes/etcd-restore-work/etcd.yaml
            sed -i "/^  annotations:$/a\\    issue-40-reload: \"${ISSUE_40_TOKEN}\"" \
              /etc/kubernetes/etcd-restore-work/etcd.yaml
            mv -f /etc/kubernetes/etcd-restore-work/etcd.yaml /etc/kubernetes/manifests/etcd.yaml
          '

          after_uid=""
          for _ in $(seq 1 120); do
            after_uid="$(kubectl -n kube-system get pod -l component=etcd -o jsonpath='{.items[0].metadata.uid}' 2>/dev/null || true)"
            ready="$(kubectl -n kube-system get pod -l component=etcd -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || true)"
            if [ -n "$after_uid" ] && [ "$after_uid" != "$before_uid" ] && [ "$ready" = true ]; then
              break
            fi
            sleep 2
          done

          test -n "$after_uid"
          test "$after_uid" != "$before_uid"
          test "$(docker exec "$node" pidof kubelet | awk '{print $1}')" = "$kubelet_pid"
          test "$(docker exec "$node" cat "/proc/${kubelet_pid}/stat" | awk '{print $22}')" = "$kubelet_start"
          kubectl get --raw=/readyz
          kubectl -n kube-system wait --for=condition=Ready pod -l component=etcd --timeout=120s

          docker exec "$node" sh -euxc '
            ETCDCTL_API=3 etcdctl \
              --endpoints=https://127.0.0.1:2379 \
              --cacert=/etc/kubernetes/pki/etcd/ca.crt \
              --cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt \
              --key=/etc/kubernetes/pki/etcd/healthcheck-client.key \
              endpoint health
          '

          printf 'before_uid=%s\nafter_uid=%s\nkubelet_pid=%s\nkubelet_start=%s\n' \
            "$before_uid" "$after_uid" "$kubelet_pid" "$kubelet_start"

      - name: Cleanup cluster
        if: always()
        shell: bash
        run: kind delete cluster --name issue-40
